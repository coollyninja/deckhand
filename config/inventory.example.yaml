schema_version: 1
status_endpoints:
  prometheus:
    base_url: https://PROMETHEUS_INTERNAL_NAME
    health_path: /-/ready
    authorization_file: /run/credentials/deckhand/prometheus-authorization
    verify_tls: true
    stale_after_seconds: 15
  home_assistant:
    base_url: https://HOME_ASSISTANT_INTERNAL_NAME
    health_path: /api/
    authorization_file: /run/credentials/deckhand/home-assistant-authorization
    verify_tls: true
    stale_after_seconds: 30
