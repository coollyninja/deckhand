[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deckhand-control-plane"
version = "0.5.0"
description = "Extensible typed-intent and status control plane for Stream Deck"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "prometheus-client>=0.22,<1",
  "pyyaml>=6.0,<7",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]

[project.scripts]
deckhand-api = "deckhand.main:run"
deckhand-issuer = "deckhand_macos.issuer:run"
deckhand-macos-agent = "deckhand_macos.main:run"
deckhand-mcp = "deckhand.mcp_server:run"
deckhand-scheduler = "deckhand.scheduler_main:run"
deckhand-wasm-host = "deckhand.wasm_host_main:run"
deckhand-worker = "deckhand.worker_main:run"
sdctl = "deckhand.cli:run"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
  "wsproto>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/broker/src/deckhand", "apps/macos-agent/src/deckhand_macos"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=deckhand --cov=deckhand_macos --cov-report=term-missing"
pythonpath = ["apps/broker/src", "apps/macos-agent/src"]
testpaths = ["apps/broker/tests", "apps/macos-agent/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/broker/tests/**" = ["S101"]
"apps/macos-agent/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deckhand", "deckhand_macos"]
mypy_path = "apps/broker/src:apps/macos-agent/src"
