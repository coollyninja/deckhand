name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/broker/src apps/macos-agent/src
      - run: uv run python scripts/check_public_surface.py
      - run: uv run pytest --cov-report=xml --cov-fail-under=70

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.0
      - run: opa fmt --fail packages/policy
      - run: opa test packages/policy -v

  plugin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @deckhand/streamdeck-plugin check
      - run: pnpm --filter @deckhand/streamdeck-plugin build
      - run: pnpm --filter @deckhand/streamdeck-plugin validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/containers/Dockerfile
          load: true
          tags: deckhand:ci
          push: false
      # Boot gate: the image must actually start and serve /healthz. This catches
      # the class of "written but never run" deploy defects (entrypoint/command
      # collisions, wrong DB path, unreachable port) that static build cannot.
      - name: Smoke-test the image serves /healthz
        run: |
          docker run -d --name deckhand-smoke \
            -e DECKHAND_DATABASE_PATH=/tmp/deckhand.db \
            -e DECKHAND_BIND_HOST=0.0.0.0 \
            -p 19470:19470 deckhand:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19470/healthz >/dev/null 2>&1; then
              echo "healthz OK"; docker rm -f deckhand-smoke; exit 0
            fi
            sleep 1
          done
          echo "healthz did not come up"; docker logs deckhand-smoke; docker rm -f deckhand-smoke; exit 1
      # Compose must be structurally valid (catches extends/anchor/port mistakes).
      - name: Validate compose stack
        run: docker compose -f deploy/containers/compose.yaml config >/dev/null
