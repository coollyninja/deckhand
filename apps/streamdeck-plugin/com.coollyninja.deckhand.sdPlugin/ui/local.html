<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Deckhand Local</title></head>
  <body>
    <label>Agent URL <input data-setting="agentUrl" type="url" placeholder="http://127.0.0.1:19471"></label>
    <label>Action ID <input data-setting="actionId" placeholder="mac.mic.toggle" required></label>
    <label>Target alias <input data-setting="target" placeholder="_ (or an alias)"></label>
    <label>Label <input data-setting="label" placeholder="MIC"></label>
    <label>State = ON when <input data-setting="stateOn" placeholder="live / recording / inhibited"></label>
    <button id="save" type="button">Save</button>
    <script src="property-inspector.js"></script>
  </body>
</html>
